[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "limex-mcp"
version = "0.1.1"
description = "MCP server for Limex research data access."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Limex" },
]
keywords = ["limex", "mcp", "agents", "research", "data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.27.0",
  "mcp>=1.0.0",
]

[project.urls]
Homepage = "https://getlimex.com"
Repository = "https://github.com/Limex-HQ/limex-mcp"
Issues = "https://github.com/Limex-HQ/limex-mcp/issues"

[project.scripts]
limex-mcp = "limex_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
